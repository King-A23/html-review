name: Website

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run site:build
      - name: Require a published release, successful CI and identical downloads
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw Error("Release tag/version mismatch");'
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          candidate_sha=$(git rev-parse HEAD)
          test "$(gh run list --workflow ci.yml --commit "$candidate_sha" --status success --json databaseId --jq length)" -gt 0
          gh release download "$RELEASE_TAG" --dir release-assets --pattern html-review.html --pattern 'html-review-v*.zip' --pattern SHA256SUMS.txt
          node -e 'const fs=require("fs");const p=require("./package.json");for(const name of ["html-review.html",`html-review-v${p.version}.zip`,"SHA256SUMS.txt"]){if(!fs.readFileSync("dist/"+name).equals(fs.readFileSync("release-assets/"+name)))throw Error("Release asset/source mismatch: "+name);}'
      - run: npm run test:site
      - name: Save browser verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-verification
          path: test-results/site-*
          if-no-files-found: ignore
      - name: Prepare deployable website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
