name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        node: ['20', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Use the configured Python interpreter
        shell: bash
        run: echo "PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install locked development dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Check generated HTML matches source
        run: npm run check

      - name: Run Node tests
        run: npm test

      - name: Test iframe bridge
        run: npm run test:bridge

      - name: Test session persistence
        run: npm run test:session

      - name: Test end-to-end workflows
        run: npm run test:e2e

      - name: Test usability
        run: npm run test:usability

      - name: Test interface
        run: npm run test:ui

      - name: Test motion
        run: npm run test:motion

      - name: Test local file reload
        run: npm run test:reload

      - name: Test review results
        run: npm run test:results

      - name: Locate Microsoft Edge on Windows
        if: matrix.os == 'windows-latest' && matrix.node == '24'
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe")
          $edge = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "Microsoft Edge is required for Windows browser verification." }
          Write-Output "Microsoft Edge $((Get-Item $edge).VersionInfo.ProductVersion)"
          "BROWSER_PATH=$edge" >> $env:GITHUB_ENV

      - name: Test Windows workflows in Microsoft Edge
        if: matrix.os == 'windows-latest' && matrix.node == '24'
        run: |
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:usability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:reload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build offline release package
        if: matrix.node == '24'
        run: npm run release:prepare

      - name: Save release downloads
        if: matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-downloads-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Save test reports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
